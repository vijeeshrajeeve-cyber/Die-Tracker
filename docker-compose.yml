x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PostgreSQL database — only reachable on the internal Docker network.
  supabase-db:
    image: postgres:15-alpine
    container_name: die-ordering-db
    env_file: .env
    environment:
      # Fail-fast if required secrets are missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-die_ordering}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-die_ordering}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    networks:
      - die-ordering-network

  # Backend API — not exposed to the host, frontend reaches it via the Docker network.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: die-ordering-backend
    env_file: .env
    environment:
      # Fail-fast if required secrets are missing.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD must be set in .env}
      # Database connection — derived from POSTGRES_* so the user sets the
      # password in one place. env_file does not expand ${VAR}; this block does.
      PGHOST: supabase-db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-die_ordering}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Sensible runtime defaults (may also be overridden in .env).
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3001}
      HOST: ${HOST:-0.0.0.0}
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    networks:
      - die-ordering-network

  # Frontend (Nginx) — the only service published to the LAN.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: die-ordering-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m
    networks:
      - die-ordering-network

volumes:
  postgres_data:
    driver: local

networks:
  die-ordering-network:
    driver: bridge
