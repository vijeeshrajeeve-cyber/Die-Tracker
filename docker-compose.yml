x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PostgreSQL database — only reachable on the internal Docker network.
  supabase-db:
    image: postgres:15-alpine
    container_name: die-ordering-db
    env_file: .env
    environment:
      # Fail-fast if required secrets are missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-die_ordering}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-die_ordering}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    networks:
      - die-ordering-network

  # Backend API — not exposed to the host, frontend reaches it via the Docker network.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: die-ordering-backend
    env_file: .env
    environment:
      # Fail-fast if required secrets are missing.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD must be set in .env}
      # Database connection — derived from POSTGRES_* so the user sets the
      # password in one place. env_file does not expand ${VAR}; this block does.
      PGHOST: supabase-db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-die_ordering}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Sensible runtime defaults (may also be overridden in .env).
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3001}
      HOST: ${HOST:-0.0.0.0}
    volumes:
      - order_backups:/app/backups
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    networks:
      - die-ordering-network

  # Frontend (Nginx) — the only service published to the LAN.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: die-ordering-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m
    networks:
      - die-ordering-network
# Supabase Meta — required by Studio to read DB schema
  supabase-meta:
    image: supabase/postgres-meta:v0.83.0
    container_name: die-ordering-meta
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-die_ordering}
      PG_META_DB_USER: ${POSTGRES_USER:-postgres}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m
    networks:
      - die-ordering-network

  # Supabase Studio — DB management web UI
  supabase-studio:
    image: supabase/studio:20250113-83c9420
    container_name: die-ordering-studio
    ports:
      - "${STUDIO_PORT:-8082}:3000"
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      DEFAULT_ORGANIZATION_NAME: "Gulf Extrusions Die Shop"
      DEFAULT_PROJECT_NAME: "Die Tracker IO"
      # Supabase Studio needs these even without GoTrue auth — use dummy values for Phase 1
      SUPABASE_URL: http://localhost:8082
      SUPABASE_PUBLIC_URL: http://localhost:8082
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-phase1-placeholder-anon-key}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-phase1-placeholder-service-key}
      AUTH_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      - supabase-meta
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    networks:
      - die-ordering-network
volumes:
  postgres_data:
    driver: local
  order_backups:
    driver: local

networks:
  die-ordering-network:
    driver: bridge
