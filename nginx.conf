server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version.
    server_tokens off;

    # Default cap, sized for the JSON API (express.json is also 10mb).
    # File-upload routes raise this individually — see location /api/ below.
    client_max_body_size 10m;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Reverse-proxy API traffic to the backend service on the Docker network.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Upload routes accept far more than the 10m default above, so without
        # these nginx rejects a legitimate upload with its own HTML 413 before
        # the request ever reaches multer — the backend's clear "file too large"
        # message never gets a say. Each cap mirrors the route's own multer
        # limits (per-file fileSize x the 10-file array cap) so multer stays the
        # single place that decides what is too big. These nested locations
        # inherit the proxy_set_header/timeout directives above; proxy_pass is
        # the one directive that has to be repeated.
        location ~ ^/api/quality-discrepancies/[0-9]+/files$ {
            client_max_body_size 260m;   # qdStorage MAX_FILE_BYTES 25m x 10
            proxy_pass http://backend:3001;
        }

        location ~ ^/api/frozen-designs/[0-9]+/files$ {
            client_max_body_size 1024m;  # frozenDesignStorage MAX_FILE_BYTES 100m x 10
            proxy_pass http://backend:3001;
        }
    }

    # SPA routing with long-term caching for fingerprinted assets.
    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Never cache the HTML shell — always fetch the latest app version.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
